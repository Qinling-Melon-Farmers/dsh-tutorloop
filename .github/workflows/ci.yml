name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate for a release
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ !inputs.ref && 'npm' || '' }}
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.12'
          cache: ${{ !inputs.ref && 'pip' || '' }}
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - run: node scripts/ci-check.mjs bots
      - run: python -m pip install -r backend/requirements.txt
      - run: npm run build
      - run: node scripts/ci-check.mjs node
        env:
          TUTORLOOP_E2E: '1'
          TUTORLOOP_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: node scripts/ci-check.mjs python
        env:
          TUTORLOOP_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: npm run check:package
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tutorloop-${{ matrix.os }}
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 7
